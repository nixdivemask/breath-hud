<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breathing sim — point Breath HUD at this window</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <canvas id="room"></canvas>
    <div id="sim-chrome">
      <strong>Breathing sim</strong>
      <span>Capture this window from Breath HUD</span>
      <label>
        People
        <input id="count" type="number" min="2" max="24" step="1" />
      </label>
      <label class="check">
        <input id="vary" type="checkbox" checked />
        Rates drift
      </label>
      <button type="button" id="btn-fs">Fullscreen</button>
    </div>
    <script type="module" src="/src/simulate.ts"></script>
  </body>
</html>
